<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOADOUT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e7ebef; --card:#ffffff; --card2:#eeece5; --line:#d6dade;
    --text:#22252b; --muted:#6d7178;
    --a:#c9463d; --a-dim:#fae6e3;
    --b:#3562c9; --b-dim:#e5ecfa;
    --rest:#9a9d9f; --rest-dim:#e9e7e1;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:24px 16px 60px;}
  .wrap{max-width:520px; margin:0 auto;}
  .brand{font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; letter-spacing:3px; color:var(--muted); text-align:center; margin-bottom:16px;}
  .tabs{display:flex; gap:8px; margin-bottom:20px;}
  .tab{flex:1; text-align:center; padding:10px; border-radius:10px; background:var(--card); border:1px solid var(--line); color:var(--muted); font-size:14px; font-weight:500; cursor:pointer;}
  .tab.active{background:var(--text); color:var(--bg); border-color:var(--text);}

  .card{border-radius:16px; padding:22px 20px 20px; border:1px solid var(--line);}
  .card.typeA{background:var(--a-dim); border-color:#e8b8b3;}
  .card.typeB{background:var(--b-dim); border-color:#b9c9ec;}
  .card.typeRest{background:var(--rest-dim); border-color:var(--line);}

  .datelabel{font-family:'JetBrains Mono',monospace; font-size:13px; color:#3a3d42; margin-bottom:4px;}
  .typebadge{display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; margin-bottom:16px;}
  .dot{width:13px; height:13px; border-radius:50%; display:inline-block;}
  .typeA .dot, .typeA .typebadge{color:var(--a);} .typeA .dot{background:var(--a);}
  .typeB .dot, .typeB .typebadge{color:var(--b);} .typeB .dot{background:var(--b);}
  .typeRest .dot, .typeRest .typebadge{color:#4d5054;} .typeRest .dot{background:#4d5054;}

  .exlist{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .ex{background:rgba(255,255,255,0.03); border-radius:10px; padding:12px 14px;}
  .exname{font-size:15px; font-weight:500;}
  .exreps{color:var(--muted); font-size:12px; margin-top:2px;}
  .restmsg{color:#3a3d42; font-size:14px;}
  .donebtn{width:100%; padding:14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif;}
  .donebtn.isdone{background:var(--text); color:var(--bg); border-color:var(--text);}

  .monthnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .monthnav button{background:var(--card); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer;}
  .monthlabel{font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:1px; color:var(--text);}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .dow{text-align:center; font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace; padding-bottom:4px;}
  .cell{aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:12px; border:1px solid transparent; gap:1px;}
  .cell.empty{visibility:hidden;}
  .cell.rest{background:var(--rest-dim); color:var(--muted);}
  .cell.a-done{background:var(--a); color:#3d0f0c; font-weight:700;}
  .cell.a-pending{background:var(--a-dim); color:var(--a); border-color:#e8b8b3;}
  .cell.b-done{background:var(--b); color:#0c2040; font-weight:700;}
  .cell.b-pending{background:var(--b-dim); color:var(--b); border-color:#b9c9ec;}
  .cell.a-missed, .cell.b-missed{background:var(--card2); color:#a35a53; border-color:#e8b8b3; border-style:dashed;}
  .cell.b-missed{color:#5877ad; border-color:#b9c9ec;}
  .cell .misslabel{font-size:8px; letter-spacing:0.5px; line-height:1;}
  .cell.istoday{outline:2px solid var(--text); outline-offset:1px;}
  .legend{display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:16px; flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .sw{width:10px; height:10px; border-radius:3px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">LOADOUT</div>
  <div class="tabs">
    <div class="tab active" id="tabToday" onclick="showTab('today')">Today</div>
    <div class="tab" id="tabMonth" onclick="showTab('month')">Month</div>
  </div>

  <div id="pageToday">
    <div class="card" id="card">
      <div class="datelabel" id="datelabel"></div>
      <div class="typebadge" id="typebadge"><span class="dot"></span><span id="typetext"></span></div>
      <div id="content"></div>
    </div>
  </div>

  <div id="pageMonth" style="display:none;">
    <div class="monthnav">
      <button onclick="shiftMonth(-1)">&#8249;</button>
      <div class="monthlabel" id="monthlabel"></div>
      <button onclick="shiftMonth(1)">&#8250;</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--a);"></span>workout A done</span>
      <span><span class="sw" style="background:var(--a-dim); border:1px solid #e8b8b3;"></span>A pending</span>
      <span><span class="sw" style="background:var(--b);"></span>workout B done</span>
      <span><span class="sw" style="background:var(--b-dim); border:1px solid #b9c9ec;"></span>B pending</span>
      <span><span class="sw" style="background:var(--rest-dim);"></span>rest</span>
      <span><span class="sw" style="background:var(--card2); border:1px dashed #a35a53;"></span>missed</span>
    </div>
  </div>
</div>

<script>
const START_DATE = new Date(2026, 7, 3);

const PLAN = {
  A: [
    {n:'Bench press', sets:3, reps:'6-8'},
    {n:'Barbell rows', sets:3, reps:'8-10'},
    {n:'Barbell curls', sets:3, reps:'10-12'}
  ],
  B: [
    {n:'Deadlifts', sets:3, reps:'5-6'},
    {n:'Bar shoulder press', sets:3, reps:'8-10'},
    {n:'Standing barbell squat (light)', sets:4, reps:'12-20'}
  ]
};

let progress = {};
let monthCursor = new Date();

function toKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dayType(d){
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
  const diff = Math.round((a-b)/86400000);
  if(diff < 0) return null;
  const n = diff + 1;
  if(n % 2 === 0) return 'Rest';
  const idx = (n-1)/2;
  return (idx % 2 === 0) ? 'A' : 'B';
}

function dayDone(key){
  return !!progress[key];
}

function loadProgress(){
  try{
    const raw = localStorage.getItem('loadout-progress');
    if(raw) progress = JSON.parse(raw);
  }catch(e){}
  renderToday();
  renderMonth();
}

function toggleToday(key){
  progress[key] = !progress[key];
  try{ localStorage.setItem('loadout-progress', JSON.stringify(progress)); }catch(e){}
  renderToday();
  renderMonth();
}

function showTab(t){
  document.getElementById('tabToday').classList.toggle('active', t==='today');
  document.getElementById('tabMonth').classList.toggle('active', t==='month');
  document.getElementById('pageToday').style.display = t==='today' ? 'block' : 'none';
  document.getElementById('pageMonth').style.display = t==='month' ? 'block' : 'none';
}

function renderToday(){
  const today = new Date();
  const key = toKey(today);
  const type = dayType(today) || 'Rest';

  document.getElementById('datelabel').textContent = today.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const card = document.getElementById('card');
  card.className = 'card type' + type;
  document.getElementById('typetext').textContent = type === 'Rest' ? 'Rest day' : 'Workout ' + type;

  const content = document.getElementById('content');
  if(type === 'Rest'){
    content.innerHTML = '<div class="restmsg">No training today.</div>';
    return;
  }
  const exs = PLAN[type];
  const done = dayDone(key);
  const list = '<div class="exlist">' + exs.map(ex =>
    '<div class="ex"><div class="exname">' + ex.n + '</div><div class="exreps">' + ex.sets + ' x ' + ex.reps + '</div></div>'
  ).join('') + '</div>';
  const btn = '<button class="donebtn' + (done ? ' isdone' : '') + '" onclick="toggleToday(\'' + key + '\')">' + (done ? 'Marked done' : 'Mark today done') + '</button>';
  content.innerHTML = list + btn;
}

function shiftMonth(delta){
  monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+delta, 1);
  renderMonth();
}

function renderMonth(){
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  document.getElementById('monthlabel').textContent = monthCursor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const first = new Date(y, m, 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const todayKey = toKey(today);

  let html = '';
  ['S','M','T','W','T','F','S'].forEach(d => html += '<div class="dow">' + d + '</div>');
  for(let i=0;i<startPad;i++) html += '<div class="cell empty"></div>';

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(y, m, day);
    const key = toKey(d);
    const type = dayType(d);
    let cls = 'cell';
    let label = '';
    if(!type || type === 'Rest'){
      cls += ' rest';
    } else {
      const done = dayDone(key);
      const isPast = d < new Date(today.getFullYear(), today.getMonth(), today.getDate());
      if(!done && isPast){
        cls += ' ' + type.toLowerCase() + '-missed';
        label = '<span class="misslabel">missed</span>';
      } else {
        cls += ' ' + type.toLowerCase() + (done ? '-done' : '-pending');
      }
    }
    if(key === todayKey) cls += ' istoday';
    html += '<div class="' + cls + '">' + day + label + '</div>';
  }
  document.getElementById('grid').innerHTML = html;
}

loadProgress();
</script>
</body>
</html>
